<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="styles/index.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
        <div class="card" data-qa="card">
          <div class="card__image"></div>

          <a href="#" class="card__title">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
          </a>

          <div class="card__code">
            Product code: <span>195434</span>
          </div>

          <div class="stars stars--4">
            <span class="stars__reviews">Reviews: 5</span>
          </div>

          <div class="card__price">
            <span class="card__price-label">Price:</span>
            <span class="card__price-value">$2,199</span>
          </div>

          <a href="#" class="card__buy" data-qa="hover">BUY</a>
        </div>
  </body>
</html>
